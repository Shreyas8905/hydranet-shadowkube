# Deployed on the SHADOW cluster (shadow-node VM). Mirrors dev-namespace's
# service names/labels exactly so that, once the Actuator reconfigures
# iptables to redirect a compromised node's traffic here, the attacker sees
# what looks like the same environment they were just in (paper's Fig. 5 /
# Fig. 3 "decoy provided by shadow cluster").
#
# Bait secrets are deliberately fake and clearly distinguishable in logs
# (but not to an attacker) so you can verify redirection worked.

apiVersion: v1
kind: Namespace
metadata:
  name: dev-namespace
  labels:
    group: weather-app
    shadow: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: weather-api-key
  namespace: dev-namespace
type: Opaque
stringData:
  WEATHER_API_KEY: "sk-BAIT-honeypot-credential-do-not-use"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keystore
  namespace: dev-namespace
  labels: { app: keystore, group: weather-app, tier: keystore, shadow: "true" }
spec:
  replicas: 1
  selector: { matchLabels: { app: keystore } }
  template:
    metadata:
      labels: { app: keystore, group: weather-app, tier: keystore }
    spec:
      containers:
        - name: keystore
          image: weather-app:lab
          command: ["python3", "keystore.py"]
          ports: [{ containerPort: 9000 }]
          envFrom:
            - secretRef: { name: weather-api-key }
---
apiVersion: v1
kind: Service
metadata:
  name: keystore
  namespace: dev-namespace
spec:
  selector: { app: keystore }
  ports: [{ port: 9000, targetPort: 9000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dev-namespace
  labels: { app: backend, group: weather-app, tier: backend, shadow: "true" }
spec:
  replicas: 1
  selector: { matchLabels: { app: backend } }
  template:
    metadata:
      labels: { app: backend, group: weather-app, tier: backend }
    spec:
      containers:
        - name: backend
          image: weather-app:lab
          command: ["python3", "backend.py"]
          ports: [{ containerPort: 8000 }]
          env:
            - name: KEYSTORE_URL
              value: "http://keystore:9000"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dev-namespace
spec:
  selector: { app: backend }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dev-namespace
  labels: { app: frontend, group: weather-app, tier: frontend, shadow: "true" }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata:
      labels: { app: frontend, group: weather-app, tier: frontend }
    spec:
      containers:
        - name: frontend
          image: weather-app:lab
          command: ["python3", "frontend.py"]
          ports: [{ containerPort: 8080 }]
          env:
            - name: BACKEND_URL
              value: "http://backend:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: dev-namespace
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - port: 8080
      targetPort: 8080
      # NOTE: in the VM-based topology this matched prod's 30080 exactly,
      # since each cluster had its own IP. Under k3d, both clusters share the
      # Codespace's localhost, so ports must differ -- 30081 here vs 30080 on
      # prod. The Actuator's redirection logic (Phase 4) accounts for this by
      # rewriting the destination port, not just the destination host.
      nodePort: 30081
