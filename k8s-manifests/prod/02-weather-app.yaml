# Build & push the shared image first (see ../app-src/README below), e.g.:
#   cd app-src && docker build -t localhost:5000/weather-app:lab .
# For a single-node k3s lab, `docker build -t weather-app:lab .` + `k3s ctr images import`
# or simply use k3s's embedded containerd via `sudo k3s ctr images import` after
# `docker save`. See docs/BUILD_NOTES.md.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: keystore
  namespace: dev-namespace
  labels:
    app: keystore
    group: weather-app
    tier: keystore
spec:
  replicas: 1
  selector:
    matchLabels: { app: keystore }
  template:
    metadata:
      labels: { app: keystore, group: weather-app, tier: keystore }
    spec:
      serviceAccountName: weather-app-sa
      containers:
        - name: keystore
          image: weather-app:lab
          command: ["python3", "keystore.py"]
          ports: [{ containerPort: 9000 }]
          envFrom:
            - secretRef: { name: weather-api-key }
---
apiVersion: v1
kind: Service
metadata:
  name: keystore
  namespace: dev-namespace
  labels: { group: weather-app }
spec:
  selector: { app: keystore }
  ports: [{ port: 9000, targetPort: 9000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dev-namespace
  labels:
    app: backend
    group: weather-app
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend, group: weather-app, tier: backend }
    spec:
      serviceAccountName: weather-app-sa
      containers:
        - name: backend
          image: weather-app:lab
          command: ["python3", "backend.py"]
          ports: [{ containerPort: 8000 }]
          env:
            - name: KEYSTORE_URL
              value: "http://keystore:9000"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dev-namespace
  labels: { group: weather-app }
spec:
  selector: { app: backend }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dev-namespace
  labels:
    app: frontend
    group: weather-app
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend, group: weather-app, tier: frontend }
    spec:
      # Over-permissioned service account (Table 2) -- this is the pivot point
      # an attacker uses after exploiting the frontend's command injection.
      serviceAccountName: weather-app-sa
      containers:
        - name: frontend
          image: weather-app:lab
          command: ["python3", "frontend.py"]
          ports: [{ containerPort: 8080 }]
          env:
            - name: BACKEND_URL
              value: "http://backend:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: dev-namespace
  labels: { group: weather-app }
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
