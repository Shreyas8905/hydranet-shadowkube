apiVersion: v1
kind: ConfigMap
metadata:
  name: shadowkube-probe-config
  namespace: shadowkube-probe
data:
  # PROBE_MODE: "auto" (default), "ebpf", or "auditd".
  PROBE_MODE: "auto"

  # PROBE_DRY_RUN: when "true", events are printed to stdout instead of POSTed
  # to the detector. Used during Phase 2 verification (no detector yet).
  # Flip to "false" once Phase 3 ships and the detector is reachable.
  PROBE_DRY_RUN: "true"

  # DETECTOR_URL: NDJSON ingest endpoint. Inside the k3d cluster this should
  # point to wherever the detector listens; for local verification leave empty
  # (the probe will refuse to start unless PROBE_DRY_RUN=true).
  DETECTOR_URL: ""
