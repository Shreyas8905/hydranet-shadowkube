apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: shadowkube-probe
  namespace: shadowkube-probe
  labels:
    app: shadowkube-probe
spec:
  selector:
    matchLabels:
      app: shadowkube-probe
  template:
    metadata:
      labels:
        app: shadowkube-probe
    spec:
      serviceAccountName: shadowkube-probe

      # Required: bpftrace attaches to host kernel probes and auditd needs to
      # see the host's audit log. hostPID/hostNetwork give the probe the host
      # process table; the privileged flag is mandatory for kernel tracing.
      hostPID: true
      hostNetwork: true

      containers:
        - name: probe
          image: shadowkube-probe:lab
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN", "SYS_PTRACE", "NET_ADMIN", "AUDIT_CONTROL"]
          envFrom:
            - configMapRef:
                name: shadowkube-probe-config
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            # For CO-RE / bpftrace: kernel symbols and BTF.
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: sys-kernel-btf
              mountPath: /sys/kernel/btf
              readOnly: true
            # For auditd tail: the host's audit log.
            - name: audit-log
              mountPath: /var/log/audit
              readOnly: true
            # For enricher /proc reads: the host PID namespace is already shared
            # via hostPID:true, so /proc is the host's.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
            type: DirectoryOrCreate
        - name: sys-kernel-btf
          hostPath:
            path: /sys/kernel/btf
            type: DirectoryOrCreate
        - name: audit-log
          hostPath:
            path: /var/log/audit
            type: DirectoryOrCreate
      tolerations:
        # Run on every node, including control-plane nodes (k3s single-node
        # "cluster" with control-plane + agent roles collapsed).
        - operator: Exists
